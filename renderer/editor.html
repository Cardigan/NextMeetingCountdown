<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CalendarTimer — Edit Meetings</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <div class="header">
    <h1>Meetings</h1>
    <div class="status" id="status"></div>
  </div>

  <div class="table-wrap">
    <table id="meetingsTable">
      <thead>
        <tr>
          <th>Day</th>
          <th>Time</th>
          <th>Title</th>
          <th>Repeats</th>
          <th>Date</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="actions">
    <button id="addBtn">+ Add meeting</button>
    <div class="right">
      <button id="cancelBtn" class="secondary">Cancel</button>
      <button id="saveBtn" class="primary">Save</button>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
