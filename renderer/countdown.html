<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CalendarTimer</title>
  <link rel="stylesheet" href="countdown.css" />
</head>
<body>
  <div class="card" id="card">
    <button class="settings-btn" id="settingsBtn" title="Settings">⚙</button>
    <button class="edit-btn" id="editBtn" title="Edit meetings">+</button>
    <button class="close-btn" id="closeBtn" title="Quit">×</button>
    <div class="title" id="title">Loading…</div>
    <div class="remaining" id="remaining">--</div>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <script src="countdown.js"></script>
</body>
</html>
